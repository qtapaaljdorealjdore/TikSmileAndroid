herename: Build Tik Smile APK

on:
workflow_dispatch:
push:
paths:
- 'TikSmileAndroid.zip'
- '.github/workflows/main.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract project
    run: |
      unzip -o TikSmileAndroid.zip -d project
      find project -name gradlew -type f

  - name: Build APK
    run: |
      cd project/TikSmileAndroid
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: TikSmile-APK
      path: project/TikSmileAndroid/app/build/outputs/apk/debug/*.apk
